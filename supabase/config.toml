# Supabase project settings used when deploying Edge Functions.
project_id = "lmtmsnkjowgeturblzzj"

[functions.stripe-api]
verify_jwt = true

# Stripe calls this directly; requests are verified by fetching each event back from Stripe.
[functions.stripe-webhook]
verify_jwt = false

# Daily deletion of businesses closed 90+ days ago (called by pg_cron with PURGE_TOKEN).
[functions.purge-closed]
verify_jwt = false

# ClickSend inbound SMS (customer replies); protected by ?token=SMS_INBOUND_TOKEN.
[functions.sms-inbound]
verify_jwt = false

# Push notifications via APNs (called by the database with PUSH_TOKEN).
[functions.push-send]
verify_jwt = false

[functions.ai-assist]
verify_jwt = true

[functions.rego-lookup]
verify_jwt = true
